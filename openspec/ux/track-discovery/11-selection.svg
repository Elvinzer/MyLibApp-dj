ction →</text></a><text x="1175" y="42" fill="#b5bac4" font-size="11" font-weight="600">MAQUETTE · V1</text><path d="M208 66H1440" stroke="#30353b"/><rect x="0" y="904" width="1440" height="96" rx="0" fill="#1c1f22"/><path d="M0 904H1440" stroke="#30353b"/><rect x="24" y="924" width="56" height="56" rx="6" fill="#695966"/><circle cx="53.68" cy="950.88" r="15.120000000000001" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="3.36"/><path d="M31.84 971.6L69.91999999999999 932.4" stroke="#fff" stroke-opacity=".45" stroke-width="3.36"/><text x="96" y="946" fill="#f5f5f5" font-size="15" font-weight="600">Afterglow (Extended Mix)</text><text x="96" y="970" fill="#b5bac4" font-size="13" font-weight="400">Nora Vale · Morceau de référence</text><a href="06-ecoute.svg"><rect x="570" y="928" width="48" height="44" rx="8" fill="#24272b" stroke="#505760"/><text x="584" y="956" fill="#f5f5f5" font-size="14" font-weight="600">▷</text></a><path d="M644 950H1015" stroke="#596169"/><path d="M644 950H644" stroke="#5ee0b0"/><text x="1038" y="956" fill="#b5bac4" font-size="12" font-weight="400">0:00 / 6:42</text><text x="1248" y="954" fill="#b5bac4" font-size="13" font-weight="400">Volume ━━━</text><text x="256" y="122" fill="#5ee0b0" font-size="11" font-weight="600">VOTRE SÉLECTION</text><text x="256" y="171" fill="#f5f5f5" font-size="34" font-weight="700">Une piste pour votre prochain set.</text><text x="256" y="204" fill="#b5bac4" font-size="15" font-weight="400">Retenez vos idées au fil des écoutes, puis préparez votre playlist.</text><a href="02-bibliotheque.svg"><rect x="256" y="238" width="226" height="44" rx="8" fill="#24272b" stroke="#505760"/><text x="270" y="266" fill="#f5f5f5" font-size="14" font-weight="600">← Continuer l’exploration</text></a><text x="256" y="334" fill="#f5f5f5" font-size="20" font-weight="600">1 titre retenu</text><text x="256" y="364" fill="#b5bac4" font-size="14" font-weight="400">Votre sélection sera conservée lorsque vous quitterez la recherche.</text><rect x="256" y="398" width="1136" height="138" rx="10" fill="#191b1e" stroke="#30353b"/><rect x="280" y="422" width="72" height="72" rx="10" fill="#695966" stroke="#30353b"/><text x="374" y="446" fill="#f5f5f5" font-size="19" font-weight="600">Mirage (Extended Mix)</text><text x="374" y="473" fill="#b5bac4" font-size="14" font-weight="400">Solen · Afro House</text><text x="374" y="506" fill="#b5bac4" font-size="13" font-weight="400">Disponible dans MyLib · 123 BPM</text><a href="06-ecoute.svg"><rect x="1138" y="428" width="224" height="44" rx="8" fill="#24272b" stroke="#505760"/><text x="1152" y="456" fill="#f5f5f5" font-size="14" font-weight="600">Écouter</text></a><a href="02-bibliotheque.svg"><rect x="1138" y="482" width="224" height="44" rx="8" fill="#24272b" stroke="#505760"/><text x="1152" y="510" fill="#f5f5f5" font-size="14" font-weight="600">Retirer de la sélection</text></a><rect x="256" y="580" width="1136" height="170" rx="10" fill="#191b1e" stroke="#30353b"/><text x="280" y="619" fill="#f5f5f5" font-size="22" font-weight="600">Préparer la playlist</text><text x="280" y="651" fill="#b5bac4" font-size="15" font-weight="400">Ce titre est prêt à rejoindre une playlist.</text><a href="05-playlist.svg"><rect x="280" y="676" width="245" height="44" rx="8" fill="#5ee0b0" stroke="#5ee0b0"/><text x="294" y="704" fill="#10231a" font-size="14" font-weight="600">Enregistrer dans une playlist</text></a><text x="256" y="856" fill="#b5bac4" font-size="12" font-weight="400">Maquette de parcours · État illustratif, sans enregistrement ni téléchargement réel.</text></svg>